# Fast, reliable handling of clicked file:// links (e.g. Alfred CLI's
# "recorded → …" artifact paths). Without this, kitty hands file:///….json to
# macOS `open`, which launches whatever heavy app Launch Services has registered
# for .json — slow, or a no-op if none is set. These rules skip `open` entirely.
#
# First matching block wins. Only file:// links are touched — http/https still
# go to your browser via open_url_with. Delete this file to revert.

# Structured / text artifacts -> open instantly in an nvim overlay in this tab.
# Any other local file -> reveal in Finder (fast; never cold-starts an app).
protocol file
action launch --type=background -- open $FILE_PATH
